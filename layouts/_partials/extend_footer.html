{{- if .Site.Params.analytics.ga4 }}
<div id="cookie-consent" class="consent" hidden>
  <div class="consent-card" role="dialog" aria-modal="true" aria-labelledby="consent-title">
    <p id="consent-title" class="consent-title">{{ i18n "consentTitle" }}</p>
    <p class="consent-text">{{ i18n "consentText" }}</p>
    <div class="consent-actions">
      <button type="button" id="consent-accept" class="btn btn-primary">{{ i18n "consentAccept" }}</button>
      <button type="button" id="consent-decline" class="btn btn-ghost">{{ i18n "consentDecline" }}</button>
    </div>
  </div>
</div>
<script>
  (function () {
    var banner = document.getElementById("cookie-consent");
    function open()  { banner.hidden = false; document.documentElement.classList.add("consent-open"); document.getElementById("consent-accept").focus(); }
    function close() { banner.hidden = true;  document.documentElement.classList.remove("consent-open"); }
    if (!localStorage.getItem("cookie-consent")) open();
    document.getElementById("consent-accept").addEventListener("click", function () {
      localStorage.setItem("cookie-consent", "accepted");
      close();
      location.reload(); // reload so the head loader picks up consent
    });
    document.getElementById("consent-decline").addEventListener("click", function () {
      localStorage.setItem("cookie-consent", "declined");
      close();
    });
    // "Cookies" in the footer reopens the banner, so a choice is never final.
    var revisit = document.getElementById("consent-revisit");
    if (revisit) revisit.addEventListener("click", function () {
      localStorage.removeItem("cookie-consent");
      open();
    });
  })();
</script>
{{- end }}
