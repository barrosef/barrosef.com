<!-- the safe: a heavy body, open and empty -->
<rect x="200" y="130" width="340" height="340" rx="18" fill="#1d4e89"/>
<rect x="232" y="162" width="276" height="276" rx="8" fill="#0b1622"/>
<!-- empty shelf -->
<rect x="232" y="300" width="276" height="10" fill="#2f5f9e"/>
