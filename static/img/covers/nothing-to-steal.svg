<path d="M540,140 L660,110 L660,490 L540,460 Z" fill="#dce6f2"/>
<path d="M540,140 L660,110 L660,490 L540,460 Z" fill="none" stroke="#7fb0ea" stroke-width="4" stroke-linejoin="round"/>
