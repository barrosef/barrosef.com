<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-hidden="true"><rect width="800" height="600" fill="#0b1622"/>
<!-- the dossier: a thick stack of pages entering from the left -->
<g fill="#dce6f2"><rect x="70" y="170" width="150" height="16" rx="8"/><rect x="70" y="204" width="180" height="16" rx="8"/><rect x="70" y="238" width="130" height="16" rx="8"/><rect x="70" y="272" width="190" height="16" rx="8"/><rect x="70" y="306" width="160" height="16" rx="8"/><rect x="70" y="340" width="120" height="16" rx="8"/><rect x="70" y="374" width="185" height="16" rx="8"/><rect x="70" y="408" width="140" height="16" rx="8"/></g>
<!-- the editor: a funnel between the stack and the wire -->
<path d="M300,140 L500,140 L500,250 L430,320 L430,460 L370,460 L370,320 L300,250 Z" fill="#1d4e89" stroke="#7fb0ea" stroke-width="4" stroke-linejoin="round"/>
<g fill="#7fb0ea"><rect x="330" y="175" width="140" height="10" rx="5"/><rect x="330" y="200" width="100" height="10" rx="5"/><rect x="330" y="225" width="120" height="10" rx="5"/></g>
<!-- what leaves: fewer, shorter lines -->
<g fill="#5b8fd6"><rect x="560" y="272" width="110" height="16" rx="8"/><rect x="560" y="306" width="80" height="16" rx="8"/><rect x="560" y="340" width="130" height="16" rx="8"/></g>
<g fill="none" stroke="#2f5f9e" stroke-width="4" stroke-linecap="round"><path d="M250,290 L292,290"/><path d="M508,290 L552,290"/></g>
<!-- the vault below: every cut kept, dashed -->
<rect x="340" y="490" width="120" height="60" rx="8" fill="none" stroke="#5b8fd6" stroke-width="4" stroke-dasharray="12 8"/>
<g fill="#2f5f9e"><rect x="360" y="508" width="80" height="8" rx="4"/><rect x="360" y="526" width="56" height="8" rx="4"/></g>
</svg>
