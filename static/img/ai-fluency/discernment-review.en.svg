<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 683" width="400" height="683" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>What the review caught</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="683" fill="#ffffff"/><rect x="16" y="16" width="368" height="84" rx="14" fill="#f4f5f7" stroke="#c9d0da" stroke-width="1.5"/><text x="32" y="42" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="700">What came back</text><text x="32" y="66" font-size="15" fill="#16233a" text-anchor="start" font-weight="400" font-style="italic">“Done. The BLACKFRIDAY coupon is in</text><text x="32" y="85" font-size="15" fill="#16233a" text-anchor="start" font-weight="400" font-style="italic">checkout and all 14 tests pass.”</text><text x="16" y="128" font-size="14" fill="#1d4e89" text-anchor="start" font-weight="700">What the review caught</text><rect x="16" y="140" width="368" height="103" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="150" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="166" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Product</text><path d="M100.39999999999999,161 C230.2,161 230.2,161 360,161" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="192" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Switch the payment method after the</text><text x="30" y="211" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">coupon, and it stacks with the</text><text x="30" y="230" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">upfront-payment discount.</text><rect x="16" y="253" width="368" height="103" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="263" width="72.39999999999999" height="22" rx="11" fill="#4f86cf"/><text x="64.19999999999999" y="279" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Process</text><path d="M100.39999999999999,274 C230.2,274 230.2,274 360,274" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="305" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Its plan checks the rule once, when</text><text x="30" y="324" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">the coupon is applied, and the 14</text><text x="30" y="343" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">tests share that assumption.</text><rect x="16" y="366" width="368" height="103" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="376" width="72.39999999999999" height="22" rx="11" fill="#4f86cf"/><text x="64.19999999999999" y="392" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Process</text><path d="M100.39999999999999,387 C230.2,387 230.2,387 360,387" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="418" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">It skipped guest checkout, where “one</text><text x="30" y="437" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">use per customer” has no customer to</text><text x="30" y="456" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">count.</text><rect x="16" y="479" width="368" height="122" rx="12" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.6"/><rect x="28" y="489" width="105.19999999999999" height="22" rx="11" fill="#b7791f"/><text x="80.6" y="505" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Performance</text><path d="M133.2,500 C246.6,500 246.6,500 360,500" fill="none" stroke="#b7791f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="531" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Three pages after you asked for brief,</text><text x="30" y="550" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">a guess about rounding instead of a</text><text x="30" y="569" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">question, and no hole flagged in your</text><text x="30" y="588" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">plan.</text><text x="200" y="625" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">An example; the tags are the author&#x27;s</text><text x="200" y="643" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">reading of the three Discernment skills of</text><text x="200" y="661" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">the AI Fluency Framework, CC BY-NC-SA 4.0.</text></svg>
