<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>O laço Descrição– Discernimento</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="550" fill="#ffffff"/><text x="200" y="30" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">O laço Descrição–</text><text x="200" y="52" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Discernimento</text><path d="M276,140 C330,140 330,140 330,232" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M330,332 C330,424 330,424 276,424" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M124,424 C70,424 70,424 70,332" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M70,232 C70,140 70,140 124,140" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="125.0" y="90.75" width="150" height="82.5" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="117.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">Descrever</text><text x="200" y="136.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">produto, processo,</text><text x="200" y="155.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">desempenho</text><rect x="262.0" y="240.75" width="128" height="82.5" rx="22" fill="#e6edf6" stroke="#4f86cf" stroke-width="1.8"/><text x="326" y="267.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">A IA responde</text><text x="326" y="286.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">um rascunho, um</text><text x="326" y="305.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">plano, código</text><rect x="125.0" y="390.75" width="150" height="82.5" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="200" y="417.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">Discernir</text><text x="200" y="436.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">está certo? como</text><text x="200" y="455.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">chegou ali?</text><rect x="10.0" y="240.75" width="128" height="82.5" rx="22" fill="#e6edf6" stroke="#4f86cf" stroke-width="1.8"/><text x="74" y="267.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">Refinar</text><text x="74" y="286.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">descrever de</text><text x="74" y="305.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">novo, melhor</text><text x="200" y="278" font-size="28" fill="#b7791f" text-anchor="middle" font-weight="700">85,7%</text><text x="200" y="302" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">das conversas</text><text x="200" y="320" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">tiveram idas</text><text x="200" y="338" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">e vindas</text><text x="200" y="510" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">O laço é do AI Fluency Framework, CC BY-NC-SA 4.0; a</text><text x="200" y="528" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">parcela é do The AI Fluency Index, Anthropic, 2026.</text></svg>
