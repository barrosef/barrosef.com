<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 651" width="480" height="651" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Uma tarefa, dividida: uma proposta a um cliente</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="480" height="651" fill="#ffffff"/><text x="16" y="34" font-size="21" fill="#16233a" text-anchor="start" font-weight="700">Uma tarefa, dividida: uma proposta</text><text x="16" y="60" font-size="21" fill="#16233a" text-anchor="start" font-weight="700">a um cliente</text><rect x="16" y="82" width="448" height="76" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="127.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">1</text><text x="60" y="114.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Decidir do que o cliente</text><text x="60" y="137.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">precisa sair convencido</text><rect x="328" y="100.0" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="125.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Você</text><rect x="16" y="168" width="448" height="76" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="213.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">2</text><text x="60" y="200.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Reunir os números dos</text><text x="60" y="223.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">seus próprios registros</text><rect x="328" y="186.0" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="211.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Você</text><rect x="16" y="254" width="448" height="84" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="303.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">3</text><text x="60" y="290.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Explorar a estrutura e</text><text x="60" y="313.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">as objeções</text><rect x="328" y="266.0" width="124" height="40" rx="8" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.5"/><text x="390.0" y="291.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Juntos</text><text x="390" y="326.0" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="400" font-style="italic">ampliação</text><rect x="16" y="348" width="448" height="84" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="397.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">4</text><text x="60" y="384.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Transformar o roteiro</text><text x="60" y="407.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">combinado em rascunho</text><rect x="328" y="360.0" width="124" height="40" rx="8" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="385.95" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">IA</text><text x="390" y="420.0" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="400" font-style="italic">automação</text><rect x="16" y="442" width="448" height="76" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="487.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">5</text><text x="60" y="474.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Conferir cada número,</text><text x="60" y="497.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">nome e promessa</text><rect x="328" y="460.0" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="485.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Você</text><rect x="16" y="528" width="448" height="53" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="561.5" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">6</text><text x="60" y="560.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Assinar e enviar</text><rect x="328" y="534.5" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="560.45" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Você</text><text x="16" y="609" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">Um exemplo de delegação de tarefas; a divisão é do</text><text x="16" y="628" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">autor. Formas do AI Fluency Framework, CC BY-NC-SA 4.0.</text></svg>
