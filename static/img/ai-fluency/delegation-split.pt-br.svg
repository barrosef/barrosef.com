<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 734" width="400" height="734" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Uma regra nova no checkout</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="734" fill="#ffffff"/><path d="M200,330 C200,202.0 200,202.0 200,74" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><path d="M200,330 C200,266.0 300,266.0 300,202" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><path d="M200,330 C200,394.0 300,394.0 300,458" fill="none" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/><path d="M200,330 C200,458.0 200,458.0 200,586" fill="none" stroke="#1d4e89" stroke-width="5" stroke-linecap="round"/><path d="M200,330 C200,394.0 100,394.0 100,458" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><path d="M200,330 C200,266.0 100,266.0 100,202" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><rect x="107.0" y="26.0" width="186" height="96" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="50.0" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">1 · Você</text><text x="200" y="69.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Definir o que é</text><text x="200" y="88.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">pronto: a regra e os</text><text x="200" y="107.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">critérios de aceite</text><rect x="207.0" y="154.0" width="186" height="96" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="300" y="178.0" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">2 · Você</text><text x="300" y="197.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Mostrar o código</text><text x="300" y="216.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">envolvido e o que as</text><text x="300" y="235.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">reuniões decidiram</text><rect x="207.0" y="410.0" width="186" height="96" rx="14" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="300" y="434.0" font-size="14" fill="#b7791f" text-anchor="middle" font-weight="700">3 · Juntos</text><text x="300" y="453.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Pensar a solução e os</text><text x="300" y="472.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">casos de borda</text><text x="300" y="491.0" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">ampliação</text><rect x="107.0" y="528.5" width="186" height="115" rx="14" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="552.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">4 · IA</text><text x="200" y="571.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="500">Escrever o código e os</text><text x="200" y="590.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="500">testes a partir do</text><text x="200" y="609.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="500">plano combinado</text><text x="200" y="628.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">automação</text><rect x="7.0" y="419.5" width="186" height="77" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="100" y="443.5" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">5 · Você</text><text x="100" y="462.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Revisar cada linha e</text><text x="100" y="481.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">rodar os testes</text><rect x="7.0" y="163.5" width="186" height="77" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="100" y="187.5" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">6 · Você</text><text x="100" y="206.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Aprovar e subir</text><text x="100" y="225.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">para produção</text><rect x="115.0" y="283.5" width="170" height="93" rx="22" fill="#ffffff" stroke="#16233a" stroke-width="1.8"/><text x="200" y="312.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Uma regra nova</text><text x="200" y="335.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">no checkout</text><text x="200" y="358.7" font-size="14.5" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">uma tarefa, seis passos</text><text x="200" y="676" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Um exemplo de delegação de tarefas; a</text><text x="200" y="694" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">divisão é do autor. Formas do AI</text><text x="200" y="712" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Fluency Framework, CC BY-NC-SA 4.0.</text></svg>
