<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 970" width="400" height="970" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Delegação</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="970" fill="#ffffff"/><path d="M200,102 C152.5,102 152.5,162.0 105,162.0" fill="none" stroke="#1d4e89" stroke-width="6" stroke-linecap="round"/><path d="M200,216 C200,181.0 217,181.0 217,146" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C208.5,216 208.5,216 217,216" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C200,251.0 217,251.0 217,286" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M105,270.0 C200.0,270.0 200.0,422.0 295,422.0" fill="none" stroke="#4f86cf" stroke-width="6" stroke-linecap="round"/><path d="M200,476 C200,441.0 183,441.0 183,406" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,476 C191.5,476 191.5,476 183,476" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,476 C200,511.0 183,511.0 183,546" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M295,530.0 C200.0,530.0 200.0,682.0 105,682.0" fill="none" stroke="#b7791f" stroke-width="6" stroke-linecap="round"/><path d="M200,736 C200,701.0 217,701.0 217,666" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,736 C208.5,736 208.5,736 217,736" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,736 C200,771.0 217,771.0 217,806" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><rect x="10.0" y="162.0" width="190" height="108" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="105" y="189.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Consciência do</text><text x="105" y="210.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">problema</text><text x="105" y="231.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">seu objetivo e o</text><text x="105" y="252.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">trabalho, antes da IA</text><rect x="217.0" y="116.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="141.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Como fica o</text><text x="297" y="159.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">trabalho pronto?</text><rect x="217.0" y="186.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="211.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Para quem é, o que</text><text x="297" y="229.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">está em jogo?</text><rect x="217.0" y="256.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="281.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">O que eu sei que a</text><text x="297" y="299.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">IA não sabe?</text><rect x="200.0" y="422.0" width="190" height="108" rx="22" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="295" y="449.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Consciência da</text><text x="295" y="470.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">plataforma</text><text x="295" y="491.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">o que esta IA faz bem,</text><text x="295" y="512.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">e seus limites</text><rect x="23.0" y="376.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="401.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Em que esta</text><text x="103" y="419.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">ferramenta é boa?</text><rect x="23.0" y="446.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="471.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">O que ela não sabe</text><text x="103" y="489.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">ou não vê?</text><rect x="23.0" y="516.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="541.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Onde ela pode</text><text x="103" y="559.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">chutar?</text><rect x="10.0" y="682.0" width="190" height="108" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="105" y="709.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Delegação de</text><text x="105" y="730.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">tarefas</text><text x="105" y="751.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">dividir o trabalho</text><text x="105" y="772.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">pelos pontos fortes</text><rect x="217.0" y="636.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="661.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Que partes pedem o</text><text x="297" y="679.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">meu julgamento?</text><rect x="217.0" y="706.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="731.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Que partes a IA faz</text><text x="297" y="749.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">ou rascunha?</text><rect x="217.0" y="767.0" width="160" height="78" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="792.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Automação,</text><text x="297" y="810.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">ampliação ou</text><text x="297" y="828.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">agência?</text><rect x="80.0" y="30.5" width="240" height="71" rx="22" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="61.3" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">Delegação</text><text x="200" y="83.3" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">se, quando e como trazer a IA</text><text x="200" y="888" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Baseado no AI Fluency Framework © 2025 Rick Dakan,</text><text x="200" y="906" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Joseph Feller e Anthropic, CC BY-NC-SA 4.0. As</text><text x="200" y="924" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">perguntas são leitura do autor. Compartilhado sob a</text><text x="200" y="942" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">mesma licença.</text></svg>
