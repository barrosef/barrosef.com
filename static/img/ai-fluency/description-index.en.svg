<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" width="400" height="720" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>How often people describe</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="720" fill="#ffffff"/><text x="200" y="34" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">How often people describe</text><text x="200" y="56" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">share of 9,830 conversations on Claude.ai</text><text x="24" y="86" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Clarifies the goal</text><rect x="24" y="94" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="94" width="153.3" height="16" rx="8" fill="#1d4e89"/><text x="334" y="107" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">51.1%</text><text x="24" y="136" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Gives examples of good</text><rect x="24" y="144" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="144" width="123.3" height="16" rx="8" fill="#1d4e89"/><text x="334" y="157" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">41.1%</text><text x="24" y="186" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Specifies format</text><rect x="24" y="194" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="194" width="90.0" height="16" rx="8" fill="#1d4e89"/><text x="334" y="207" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">30.0%</text><text x="24" y="236" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Sets the interaction mode</text><rect x="24" y="244" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="244" width="90.0" height="16" rx="8" fill="#1d4e89"/><text x="334" y="257" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">30.0%</text><text x="24" y="286" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">States tone and style</text><rect x="24" y="294" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="294" width="68.1" height="16" rx="8" fill="#1d4e89"/><text x="334" y="307" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">22.7%</text><text x="24" y="336" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Defines the audience</text><rect x="24" y="344" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="344" width="52.8" height="16" rx="8" fill="#1d4e89"/><text x="334" y="357" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">17.6%</text><text x="200" y="404" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">With and without iteration</text><rect x="96" y="419" width="14" height="14" rx="4" fill="#b7791f"/><text x="116" y="431" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">iterated</text><rect x="216" y="419" width="14" height="14" rx="4" fill="#c9d0da"/><text x="236" y="431" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">did not</text><text x="24" y="460" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Clarifies the goal</text><rect x="24" y="468" width="163.5" height="14" rx="7" fill="#b7791f"/><text x="195.5" y="480" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">54.5%</text><rect x="24" y="488" width="92.7" height="14" rx="7" fill="#c9d0da"/><text x="124.7" y="500" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">30.9%</text><text x="24" y="526" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Gives examples</text><rect x="24" y="534" width="133.2" height="14" rx="7" fill="#b7791f"/><text x="165.2" y="546" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">44.4%</text><rect x="24" y="554" width="65.4" height="14" rx="7" fill="#c9d0da"/><text x="97.4" y="566" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">21.8%</text><text x="24" y="592" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Specifies format</text><rect x="24" y="600" width="97.2" height="14" rx="7" fill="#b7791f"/><text x="129.2" y="612" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">32.4%</text><rect x="24" y="620" width="48.3" height="14" rx="7" fill="#c9d0da"/><text x="80.3" y="632" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">16.1%</text><text x="200" y="662" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Source: The AI Fluency Index, Anthropic,</text><text x="200" y="680" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">February 2026 (January 2026 sample). Grouping</text><text x="200" y="698" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">these as Description is the author&#x27;s reading.</text></svg>
