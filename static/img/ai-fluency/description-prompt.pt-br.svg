<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 821" width="400" height="821" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Depois</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="821" fill="#ffffff"/><rect x="16" y="16" width="368" height="74" rx="14" fill="#f4f5f7" stroke="#c9d0da" stroke-width="1.5"/><text x="32" y="42" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="700">Antes</text><text x="32" y="66" font-size="15" fill="#5d6b7d" text-anchor="start" font-weight="400" font-style="italic">“coloque a regra do cupom no nosso checkout”</text><text x="16" y="116" font-size="14" fill="#1d4e89" text-anchor="start" font-weight="700">Depois</text><rect x="16" y="128" width="368" height="103" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="138" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="154" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Produto</text><path d="M100.39999999999999,149 C230.2,149 230.2,149 360,149" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="180" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Crie um cupom de Black Friday no</text><text x="30" y="199" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">checkout. Seguem o CouponService e o</text><text x="30" y="218" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">código de preços que ele usa.</text><rect x="16" y="241" width="368" height="84" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="251" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="267" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Produto</text><path d="M100.39999999999999,262 C230.2,262 230.2,262 360,262" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="293" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Um uso por cliente. Ele nunca soma com</text><text x="30" y="312" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">o desconto do Pix.</text><rect x="16" y="335" width="368" height="84" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="345" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="361" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Produto</text><path d="M100.39999999999999,356 C230.2,356 230.2,356 360,356" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="387" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Siga o cupom BEMVINDO10, que já usa o</text><text x="30" y="406" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">nosso padrão.</text><rect x="16" y="429" width="368" height="103" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="439" width="80.6" height="22" rx="11" fill="#4f86cf"/><text x="68.3" y="455" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Processo</text><path d="M108.6,450 C234.3,450 234.3,450 360,450" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="481" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Primeiro liste os casos de borda e</text><text x="30" y="500" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">espere o meu ok; depois escreva o</text><text x="30" y="519" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">código e os testes.</text><rect x="16" y="542" width="368" height="84" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="552" width="80.6" height="22" rx="11" fill="#4f86cf"/><text x="68.3" y="568" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Processo</text><path d="M108.6,563 C234.3,563 234.3,563 360,563" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="594" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Explique o seu raciocínio antes de</text><text x="30" y="613" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">cada mudança.</text><rect x="16" y="636" width="368" height="103" rx="12" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.6"/><rect x="28" y="646" width="97.0" height="22" rx="11" fill="#b7791f"/><text x="76.5" y="662" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Desempenho</text><path d="M125.0,657 C242.5,657 242.5,657 360,657" fill="none" stroke="#b7791f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="688" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Seja breve. Se uma regra estiver</text><text x="30" y="707" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">confusa, pergunte em vez de chutar, e</text><text x="30" y="726" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">me avise se o meu plano tiver furo.</text><text x="200" y="763" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Um exemplo; as etiquetas são leitura do</text><text x="200" y="781" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">autor das três habilidades de Descrição do</text><text x="200" y="799" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">AI Fluency Framework, CC BY-NC-SA 4.0.</text></svg>
