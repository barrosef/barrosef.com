<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 683" width="400" height="683" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>O que a revisão pegou</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="683" fill="#ffffff"/><rect x="16" y="16" width="368" height="84" rx="14" fill="#f4f5f7" stroke="#c9d0da" stroke-width="1.5"/><text x="32" y="42" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="700">O que voltou</text><text x="32" y="66" font-size="15" fill="#16233a" text-anchor="start" font-weight="400" font-style="italic">“Pronto. O cupom BLACKFRIDAY está no</text><text x="32" y="85" font-size="15" fill="#16233a" text-anchor="start" font-weight="400" font-style="italic">checkout e os 14 testes passam.”</text><text x="16" y="128" font-size="14" fill="#1d4e89" text-anchor="start" font-weight="700">O que a revisão pegou</text><rect x="16" y="140" width="368" height="103" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="150" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="166" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Produto</text><path d="M100.39999999999999,161 C230.2,161 230.2,161 360,161" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="192" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Troque a forma de pagamento depois do</text><text x="30" y="211" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">cupom, e ele soma com o desconto do</text><text x="30" y="230" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Pix.</text><rect x="16" y="253" width="368" height="103" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="263" width="80.6" height="22" rx="11" fill="#4f86cf"/><text x="68.3" y="279" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Processo</text><path d="M108.6,274 C234.3,274 234.3,274 360,274" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="305" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">O plano confere a regra uma vez só,</text><text x="30" y="324" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">quando o cupom entra, e os 14 testes</text><text x="30" y="343" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">partem da mesma suposição.</text><rect x="16" y="366" width="368" height="103" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="376" width="80.6" height="22" rx="11" fill="#4f86cf"/><text x="68.3" y="392" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Processo</text><path d="M108.6,387 C234.3,387 234.3,387 360,387" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="418" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Ela pulou a compra sem cadastro, onde</text><text x="30" y="437" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">“um uso por cliente” não tem cliente</text><text x="30" y="456" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">para contar.</text><rect x="16" y="479" width="368" height="122" rx="12" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.6"/><rect x="28" y="489" width="97.0" height="22" rx="11" fill="#b7791f"/><text x="76.5" y="505" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Desempenho</text><path d="M125.0,500 C242.5,500 242.5,500 360,500" fill="none" stroke="#b7791f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="531" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Três páginas depois de você pedir algo</text><text x="30" y="550" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">curto, um chute sobre arredondamento</text><text x="30" y="569" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">em vez de uma pergunta, e nenhum furo</text><text x="30" y="588" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">apontado no seu plano.</text><text x="200" y="625" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Um exemplo; as etiquetas são leitura do autor</text><text x="200" y="643" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">das três habilidades de Discernimento do AI</text><text x="200" y="661" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Fluency Framework, CC BY-NC-SA 4.0.</text></svg>
