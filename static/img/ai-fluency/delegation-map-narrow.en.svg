<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 970" width="400" height="970" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Delegation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="970" fill="#ffffff"/><path d="M200,102 C152.5,102 152.5,172.5 105,172.5" fill="none" stroke="#1d4e89" stroke-width="6" stroke-linecap="round"/><path d="M200,216 C200,181.0 217,181.0 217,146" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C208.5,216 208.5,216 217,216" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C200,251.0 217,251.0 217,286" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M105,259.5 C200.0,259.5 200.0,432.5 295,432.5" fill="none" stroke="#4f86cf" stroke-width="6" stroke-linecap="round"/><path d="M200,476 C200,441.0 183,441.0 183,406" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,476 C191.5,476 191.5,476 183,476" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,476 C200,511.0 183,511.0 183,546" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M295,519.5 C200.0,519.5 200.0,692.5 105,692.5" fill="none" stroke="#b7791f" stroke-width="6" stroke-linecap="round"/><path d="M200,736 C200,701.0 217,701.0 217,666" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,736 C208.5,736 208.5,736 217,736" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,736 C200,771.0 217,771.0 217,806" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><rect x="10.0" y="172.5" width="190" height="87" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="105" y="200.1" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Problem awareness</text><text x="105" y="221.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">your goal and the</text><text x="105" y="242.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">work, before AI</text><rect x="217.0" y="116.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="141.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What does done</text><text x="297" y="159.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">look like?</text><rect x="217.0" y="186.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="211.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Who is it for, what</text><text x="297" y="229.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">is at stake?</text><rect x="217.0" y="256.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="281.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What do I know that</text><text x="297" y="299.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">AI doesn&#x27;t?</text><rect x="200.0" y="432.5" width="190" height="87" rx="22" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="295" y="460.1" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Platform awareness</text><text x="295" y="481.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">what this AI does</text><text x="295" y="502.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">well, and its limits</text><rect x="23.0" y="376.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="401.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What is this</text><text x="103" y="419.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">tool good at?</text><rect x="23.0" y="446.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="471.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What can&#x27;t it</text><text x="103" y="489.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">know or see?</text><rect x="23.0" y="516.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="541.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Where might it</text><text x="103" y="559.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">make things up?</text><rect x="10.0" y="692.5" width="190" height="87" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="105" y="720.1" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Task delegation</text><text x="105" y="741.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">split the work by</text><text x="105" y="762.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">strengths</text><rect x="217.0" y="636.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="661.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Which parts need</text><text x="297" y="679.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">my judgement?</text><rect x="217.0" y="706.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="731.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Which parts can AI</text><text x="297" y="749.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">do or draft?</text><rect x="217.0" y="767.0" width="160" height="78" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="792.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Automation,</text><text x="297" y="810.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">augmentation or</text><text x="297" y="828.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">agency?</text><rect x="80.0" y="19.5" width="240" height="93" rx="22" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="50.3" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">Delegation</text><text x="200" y="72.3" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">whether, when and how to bring</text><text x="200" y="94.3" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">AI in</text><text x="200" y="888" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Based on the AI Fluency Framework © 2025 Rick Dakan,</text><text x="200" y="906" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Joseph Feller and Anthropic, CC BY-NC-SA 4.0. The</text><text x="200" y="924" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">questions are the author&#x27;s reading. Shared under the</text><text x="200" y="942" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">same license.</text></svg>
