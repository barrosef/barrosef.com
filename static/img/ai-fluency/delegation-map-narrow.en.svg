<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 884" width="400" height="884" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Delegation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="884" fill="#ffffff"/><rect x="100" y="20" width="200" height="48" rx="24.0" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.5"/><text x="200.0" y="51.0" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">Delegation</text><text x="200" y="92" font-size="14.5" fill="#1d4e89" text-anchor="middle" font-weight="500" font-style="italic">whether, when and how to bring AI in</text><rect x="30" y="116" width="340" height="44" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="200.0" y="144.3" font-size="18" fill="#16233a" text-anchor="middle" font-weight="700">Problem awareness</text><text x="212" y="182" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">your goal and the work, before AI</text><line x1="46" y1="160" x2="46" y2="294" stroke="#9fb4cf" stroke-width="2"/><line x1="46" y1="214" x2="58" y2="214" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="198" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="218.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What does finished look like?</text><line x1="46" y1="254" x2="58" y2="254" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="238" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="258.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Who is it for, what is at stake?</text><line x1="46" y1="294" x2="58" y2="294" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="278" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="298.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What do I know that AI can&#x27;t?</text><rect x="30" y="342" width="340" height="44" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="200.0" y="370.3" font-size="18" fill="#16233a" text-anchor="middle" font-weight="700">Platform awareness</text><text x="212" y="408" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">what this AI does well, and its limits</text><line x1="46" y1="386" x2="46" y2="520" stroke="#9fb4cf" stroke-width="2"/><line x1="46" y1="440" x2="58" y2="440" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="424" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="444.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What is this tool good at?</text><line x1="46" y1="480" x2="58" y2="480" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="464" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="484.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What can&#x27;t it know or see?</text><line x1="46" y1="520" x2="58" y2="520" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="504" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="524.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Where might it invent?</text><rect x="30" y="568" width="340" height="44" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="200.0" y="596.3" font-size="18" fill="#16233a" text-anchor="middle" font-weight="700">Task delegation</text><text x="212" y="634" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">split the work by strengths</text><line x1="46" y1="612" x2="46" y2="746" stroke="#9fb4cf" stroke-width="2"/><line x1="46" y1="666" x2="58" y2="666" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="650" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="670.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Which parts need my judgement?</text><line x1="46" y1="706" x2="58" y2="706" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="690" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="710.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Which parts can AI do or draft?</text><line x1="46" y1="746" x2="58" y2="746" stroke="#9fb4cf" stroke-width="2"/><rect x="58" y="730" width="320" height="32" rx="16.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="218.0" y="750.9" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Automation, augmentation or agency?</text><text x="200" y="802" font-size="13" fill="#5d6b7d" text-anchor="middle" font-weight="400">Based on the AI Fluency Framework © 2025 Rick Dakan,</text><text x="200" y="820" font-size="13" fill="#5d6b7d" text-anchor="middle" font-weight="400">Joseph Feller and Anthropic, CC BY-NC-SA 4.0. The</text><text x="200" y="838" font-size="13" fill="#5d6b7d" text-anchor="middle" font-weight="400">questions are the author&#x27;s reading. Shared under the</text><text x="200" y="856" font-size="13" fill="#5d6b7d" text-anchor="middle" font-weight="400">same license.</text></svg>
