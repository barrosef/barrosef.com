0" y="183.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Descrição do produto</text><text x="370" y="205.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">o resultado: formato,</text><text x="370" y="227.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">público e estilo</text><rect x="40.0" y="48.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="140" y="74.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">O que deve voltar, e</text><text x="140" y="94.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">em que forma?</text><rect x="20.0" y="173.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="120" y="199.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Quem vai ler ou</text><text x="120" y="219.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">rodar isso?</text><rect x="50.0" y="298.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="150" y="324.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Tenho um exemplo</text><text x="150" y="344.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">do que é bom?</text><rect x="695.0" y="165.5" width="270" height="69" rx="22" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="830" y="194.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Descrição do processo</text><text x="830" y="216.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">como a IA aborda o seu pedido</text><rect x="960.0" y="48.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1060" y="74.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Que passos, em</text><text x="1060" y="94.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">que ordem?</text><rect x="980.0" y="173.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1080" y="199.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Que contexto e</text><text x="1080" y="219.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">regras ela precisa?</text><rect x="950.0" y="298.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1050" y="324.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Pensar antes, ou</text><text x="1050" y="344.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">responder direto?</text><rect x="465.0" y="469.5" width="270" height="91" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="600" y="498.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Descrição do desempenho</text><text x="600" y="520.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">como a IA se comporta</text><text x="600" y="542.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">enquanto vocês trabalham</text><rect x="225.0" y="583.5" width="200" height="43" rx="21.5" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="325" y="609.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Curta ou detalhada?</text><rect x="500.0" y="643.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="600" y="669.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Me questionar, ou</text><text x="600" y="689.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">me apoiar?</text><rect x="775.0" y="583.5" width="200" height="43" rx="21.5" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="875" y="609.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Perguntar, ou supor?</text><rect x="465.0" y="277.5" width="270" height="105" rx="22" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="600" y="311.5" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">Descrição</text><text x="600" y="337.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">dizer o que você precisa, para a IA</text><text x="600" y="363.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">entregar</text><text x="600" y="738" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Baseado no AI Fluency Framework © 2025 Rick Dakan, Joseph Feller e Anthropic, CC BY-NC-SA 4.0. As perguntas são leitura do autor.</text><text x="600" y="758" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Compartilhado sob a mesma licença.</text></svg>
