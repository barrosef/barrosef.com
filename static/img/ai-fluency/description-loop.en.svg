<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 568" width="400" height="568" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>The Description– Discernment loop</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="568" fill="#ffffff"/><text x="200" y="30" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">The Description–</text><text x="200" y="52" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Discernment loop</text><path d="M276,140 C330,140 330,140 330,232" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M330,332 C330,424 330,424 276,424" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M124,424 C70,424 70,424 70,332" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M70,232 C70,140 70,140 124,140" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="125.0" y="90.75" width="150" height="82.5" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="117.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">Describe</text><text x="200" y="136.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">product, process,</text><text x="200" y="155.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">performance</text><rect x="262.0" y="240.75" width="128" height="82.5" rx="22" fill="#e6edf6" stroke="#4f86cf" stroke-width="1.8"/><text x="326" y="267.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">AI answers</text><text x="326" y="286.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">a draft, a</text><text x="326" y="305.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">plan, code</text><rect x="125.0" y="390.75" width="150" height="82.5" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="200" y="417.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">Discern</text><text x="200" y="436.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">is it right? how did</text><text x="200" y="455.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">it get there?</text><rect x="10.0" y="240.75" width="128" height="82.5" rx="22" fill="#e6edf6" stroke="#4f86cf" stroke-width="1.8"/><text x="74" y="267.95" font-size="16.5" fill="#16233a" text-anchor="middle" font-weight="700">Refine</text><text x="74" y="286.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">describe</text><text x="74" y="305.95" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">again, better</text><text x="200" y="278" font-size="28" fill="#b7791f" text-anchor="middle" font-weight="700">85.7%</text><text x="200" y="302" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">of conversations</text><text x="200" y="320" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">went back</text><text x="200" y="338" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">and forth</text><text x="200" y="510" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">The loop is from the AI Fluency Framework,</text><text x="200" y="528" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">CC BY-NC-SA 4.0; the share is from The AI</text><text x="200" y="546" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Fluency Index, Anthropic, 2026.</text></svg>
