<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 464" width="400" height="464" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Três formas de trabalhar com IA</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="464" fill="#ffffff"/><text x="200" y="36" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Três formas de trabalhar com IA</text><rect x="20" y="60" width="360" height="92" rx="10" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="200" y="92" font-size="18" fill="#1d4e89" text-anchor="middle" font-weight="700">Automação</text><text x="200" y="118" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400">a IA executa uma tarefa específica que</text><text x="200" y="138" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400">você definiu</text><rect x="20" y="168" width="360" height="92" rx="10" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="200" y="200" font-size="18" fill="#1d4e89" text-anchor="middle" font-weight="700">Ampliação</text><text x="200" y="226" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400">você e a IA pensam juntos, num vai e vem</text><rect x="20" y="276" width="360" height="92" rx="10" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="200" y="308" font-size="18" fill="#1d4e89" text-anchor="middle" font-weight="700">Agência</text><text x="200" y="334" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400">você prepara a IA para trabalhar</text><text x="200" y="354" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400">sozinha, em seu nome</text><text x="200" y="400" font-size="13" fill="#5d6b7d" text-anchor="middle" font-weight="400">Baseado no AI Fluency Framework © 2025 Rick Dakan,</text><text x="200" y="418" font-size="13" fill="#5d6b7d" text-anchor="middle" font-weight="400">Joseph Feller e Anthropic, CC BY-NC-SA 4.0. Este</text><text x="200" y="436" font-size="13" fill="#5d6b7d" text-anchor="middle" font-weight="400">mapa é compartilhado sob a mesma licença.</text></svg>