<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 744" width="400" height="744" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Com que frequência as pessoas descrevem</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="744" fill="#ffffff"/><text x="200" y="34" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Com que frequência as</text><text x="200" y="58" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">pessoas descrevem</text><text x="200" y="80" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">parcela de 9.830 conversas no Claude.ai</text><text x="24" y="110" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Deixa claro o objetivo</text><rect x="24" y="118" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="118" width="153.3" height="16" rx="8" fill="#1d4e89"/><text x="334" y="131" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">51,1%</text><text x="24" y="160" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Dá exemplos do que é bom</text><rect x="24" y="168" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="168" width="123.3" height="16" rx="8" fill="#1d4e89"/><text x="334" y="181" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">41,1%</text><text x="24" y="210" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Especifica o formato</text><rect x="24" y="218" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="218" width="90.0" height="16" rx="8" fill="#1d4e89"/><text x="334" y="231" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">30,0%</text><text x="24" y="260" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Define o jeito de interagir</text><rect x="24" y="268" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="268" width="90.0" height="16" rx="8" fill="#1d4e89"/><text x="334" y="281" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">30,0%</text><text x="24" y="310" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Diz o tom e o estilo</text><rect x="24" y="318" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="318" width="68.1" height="16" rx="8" fill="#1d4e89"/><text x="334" y="331" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">22,7%</text><text x="24" y="360" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Define o público</text><rect x="24" y="368" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="368" width="52.8" height="16" rx="8" fill="#1d4e89"/><text x="334" y="381" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">17,6%</text><text x="200" y="428" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Com e sem idas e vindas</text><rect x="96" y="443" width="14" height="14" rx="4" fill="#b7791f"/><text x="116" y="455" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">refinou</text><rect x="216" y="443" width="14" height="14" rx="4" fill="#c9d0da"/><text x="236" y="455" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">não refinou</text><text x="24" y="484" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Deixa claro o objetivo</text><rect x="24" y="492" width="163.5" height="14" rx="7" fill="#b7791f"/><text x="195.5" y="504" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">54,5%</text><rect x="24" y="512" width="92.7" height="14" rx="7" fill="#c9d0da"/><text x="124.7" y="524" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">30,9%</text><text x="24" y="550" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Dá exemplos</text><rect x="24" y="558" width="133.2" height="14" rx="7" fill="#b7791f"/><text x="165.2" y="570" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">44,4%</text><rect x="24" y="578" width="65.4" height="14" rx="7" fill="#c9d0da"/><text x="97.4" y="590" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">21,8%</text><text x="24" y="616" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Especifica o formato</text><rect x="24" y="624" width="97.2" height="14" rx="7" fill="#b7791f"/><text x="129.2" y="636" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">32,4%</text><rect x="24" y="644" width="48.3" height="14" rx="7" fill="#c9d0da"/><text x="80.3" y="656" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">16,1%</text><text x="200" y="686" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Fonte: The AI Fluency Index, Anthropic, fevereiro de</text><text x="200" y="704" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">2026 (amostra de janeiro de 2026). Agrupar estes</text><text x="200" y="722" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">comportamentos como Descrição é leitura do autor.</text></svg>
