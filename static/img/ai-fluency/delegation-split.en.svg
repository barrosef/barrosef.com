<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 734" width="400" height="734" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>A new checkout rule</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="734" fill="#ffffff"/><path d="M200,330 C200,202.0 200,202.0 200,74" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><path d="M200,330 C200,266.0 300,266.0 300,202" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><path d="M200,330 C200,394.0 300,394.0 300,458" fill="none" stroke="#b7791f" stroke-width="5" stroke-linecap="round"/><path d="M200,330 C200,458.0 200,458.0 200,586" fill="none" stroke="#1d4e89" stroke-width="5" stroke-linecap="round"/><path d="M200,330 C200,394.0 100,394.0 100,458" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><path d="M200,330 C200,266.0 100,266.0 100,202" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round"/><rect x="107.0" y="16.5" width="186" height="115" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="40.5" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">1 · You</text><text x="200" y="59.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Decide what done</text><text x="200" y="78.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">means: the rule</text><text x="200" y="97.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">and its acceptance</text><text x="200" y="116.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">criteria</text><rect x="207.0" y="154.0" width="186" height="96" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="300" y="178.0" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">2 · You</text><text x="300" y="197.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Point to the code</text><text x="300" y="216.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">involved and what the</text><text x="300" y="235.0" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">meetings decided</text><rect x="207.0" y="400.5" width="186" height="115" rx="14" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="300" y="424.5" font-size="14" fill="#b7791f" text-anchor="middle" font-weight="700">3 · Together</text><text x="300" y="443.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Think through the</text><text x="300" y="462.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">solution and the</text><text x="300" y="481.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">edge cases</text><text x="300" y="500.5" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">augmentation</text><rect x="107.0" y="528.5" width="186" height="115" rx="14" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="552.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">4 · AI</text><text x="200" y="571.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="500">Write the code and</text><text x="200" y="590.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="500">the tests from the</text><text x="200" y="609.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="500">agreed plan</text><text x="200" y="628.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">automation</text><rect x="7.0" y="419.5" width="186" height="77" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="100" y="443.5" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">5 · You</text><text x="100" y="462.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Review every line and</text><text x="100" y="481.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">run the tests</text><rect x="7.0" y="163.5" width="186" height="77" rx="14" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.8"/><text x="100" y="187.5" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">6 · You</text><text x="100" y="206.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Approve it and</text><text x="100" y="225.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">ship it</text><rect x="115.0" y="283.5" width="170" height="93" rx="22" fill="#ffffff" stroke="#16233a" stroke-width="1.8"/><text x="200" y="312.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">A new</text><text x="200" y="335.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">checkout rule</text><text x="200" y="358.7" font-size="14.5" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">one task, six steps</text><text x="200" y="676" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">An example of task delegation; the split</text><text x="200" y="694" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">is the author&#x27;s. Modes from the AI</text><text x="200" y="712" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Fluency Framework, CC BY-NC-SA 4.0.</text></svg>
