<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 644" width="480" height="644" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>One task, split: a client proposal</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="480" height="644" fill="#ffffff"/><text x="16" y="34" font-size="21" fill="#16233a" text-anchor="start" font-weight="700">One task, split: a client proposal</text><rect x="16" y="56" width="448" height="76" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="101.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">1</text><text x="60" y="88.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Decide what the client</text><text x="60" y="111.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">must leave convinced of</text><rect x="328" y="74.0" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="99.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">You</text><rect x="16" y="142" width="448" height="76" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="187.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">2</text><text x="60" y="174.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Gather the figures from</text><text x="60" y="197.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">your own records</text><rect x="328" y="160.0" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="185.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">You</text><rect x="16" y="228" width="448" height="84" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="277.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">3</text><text x="60" y="264.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Explore structure and</text><text x="60" y="287.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">objections</text><rect x="328" y="240.0" width="124" height="40" rx="8" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.5"/><text x="390.0" y="265.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Together</text><text x="390" y="300.0" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="400" font-style="italic">augmentation</text><rect x="16" y="322" width="448" height="84" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="371.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">4</text><text x="60" y="358.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Turn the agreed outline</text><text x="60" y="381.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">into a first draft</text><rect x="328" y="334.0" width="124" height="40" rx="8" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="359.95" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">AI</text><text x="390" y="394.0" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="400" font-style="italic">automation</text><rect x="16" y="416" width="448" height="76" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="461.0" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">5</text><text x="60" y="448.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Check every number, name</text><text x="60" y="471.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">and promise</text><rect x="328" y="434.0" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="459.95" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">You</text><rect x="16" y="502" width="448" height="53" rx="10" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="38" y="535.5" font-size="20" fill="#5d6b7d" text-anchor="middle" font-weight="700">6</text><text x="60" y="534.5" font-size="18" fill="#16233a" text-anchor="start" font-weight="500">Sign it and send it</text><rect x="328" y="508.5" width="124" height="40" rx="8" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="390.0" y="534.45" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">You</text><text x="16" y="583" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">An example of task delegation; the split is the</text><text x="16" y="602" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">author&#x27;s. Modes from the AI Fluency Framework, CC</text><text x="16" y="621" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">BY-NC-SA 4.0.</text></svg>
