<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Discernimento</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="1200" height="770" fill="#ffffff"/><path d="M600,330 C485.0,330 485.0,200 370,200" fill="none" stroke="#1d4e89" stroke-width="7" stroke-linecap="round"/><path d="M370,200 C255.0,200 255.0,80 140,80" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M370,200 C245.0,200 245.0,205 120,205" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M370,200 C260.0,200 260.0,330 150,330" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M600,330 C715.0,330 715.0,200 830,200" fill="none" stroke="#4f86cf" stroke-width="7" stroke-linecap="round"/><path d="M830,200 C945.0,200 945.0,80 1060,80" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M830,200 C955.0,200 955.0,205 1080,205" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M830,200 C940.0,200 940.0,330 1050,330" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M600,330 C600,422.5 600,422.5 600,515" fill="none" stroke="#b7791f" stroke-width="7" stroke-linecap="round"/><path d="M600,515 C462.5,515 462.5,605 325,605" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M600,515 C600,595.0 600,595.0 600,675" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M600,515 C737.5,515 737.5,605 875,605" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><rect x="235.0" y="154.5" width="270" height="91" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="370" y="183.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Discernimento do produto</text><text x="370" y="205.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">o resultado: correto,</text><text x="370" y="227.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">adequado, coerente, relevante</text><rect x="40.0" y="48.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="140" y="74.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Está certo, ou só</text><text x="140" y="94.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">arrumado?</text><rect x="20.0" y="183.5" width="200" height="43" rx="21.5" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="120" y="209.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">É o que eu pedi?</text><rect x="50.0" y="298.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="150" y="324.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">O que faria isso</text><text x="150" y="344.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">quebrar?</text><rect x="695.0" y="165.5" width="270" height="69" rx="22" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="830" y="194.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Discernimento do processo</text><text x="830" y="216.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">como a IA chegou ao resultado</text><rect x="960.0" y="48.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1060" y="74.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Cada passo faz</text><text x="1060" y="94.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">sentido?</text><rect x="980.0" y="173.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1080" y="199.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">O que ela pulou</text><text x="1080" y="219.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">ou supôs?</text><rect x="950.0" y="308.5" width="200" height="43" rx="21.5" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1050" y="334.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Eu pensaria assim?</text><rect x="465.0" y="458.5" width="270" height="113" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="600" y="487.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Discernimento do</text><text x="600" y="509.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">desempenho</text><text x="600" y="531.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">como a IA se comporta</text><text x="600" y="553.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">enquanto vocês trabalham</text><rect x="225.0" y="583.5" width="200" height="43" rx="21.5" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="325" y="609.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">O jeito dela me serve?</text><rect x="500.0" y="643.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="600" y="669.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Ela perguntou,</text><text x="600" y="689.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">ou chutou?</text><rect x="775.0" y="573.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="875" y="599.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Ela só concorda</text><text x="875" y="619.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">comigo?</text><rect x="465.0" y="277.5" width="270" height="105" rx="22" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="600" y="311.5" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">Discernimento</text><text x="600" y="337.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">julgar o que volta, e</text><text x="600" y="363.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">como chegou lá</text><text x="600" y="738" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Baseado no AI Fluency Framework © 2025 Rick Dakan, Joseph Feller e Anthropic, CC BY-NC-SA 4.0. As perguntas são leitura do autor.</text><text x="600" y="758" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Compartilhado sob a mesma licença.</text></svg>
