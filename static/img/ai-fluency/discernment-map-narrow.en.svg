<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 996" width="400" height="996" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Discernment</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="996" fill="#ffffff"/><path d="M200,102 C152.5,102 152.5,151.5 105,151.5" fill="none" stroke="#1d4e89" stroke-width="6" stroke-linecap="round"/><path d="M200,216 C200,181.0 217,181.0 217,146" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C208.5,216 208.5,216 217,216" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C200,251.0 217,251.0 217,286" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M105,280.5 C200.0,280.5 200.0,432.0 295,432.0" fill="none" stroke="#4f86cf" stroke-width="6" stroke-linecap="round"/><path d="M200,486 C200,451.0 183,451.0 183,416" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,486 C191.5,486 191.5,486 183,486" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,486 C200,521.0 183,521.0 183,556" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M295,540.0 C200.0,540.0 200.0,702.0 105,702.0" fill="none" stroke="#b7791f" stroke-width="6" stroke-linecap="round"/><path d="M200,756 C200,721.0 217,721.0 217,686" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,756 C208.5,756 208.5,756 217,756" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,756 C200,791.0 217,791.0 217,826" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><rect x="10.0" y="151.5" width="190" height="129" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="105" y="179.1" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Product</text><text x="105" y="200.1" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">discernment</text><text x="105" y="221.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">the output:</text><text x="105" y="242.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">accurate, fitting,</text><text x="105" y="263.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">coherent, relevant</text><rect x="217.0" y="116.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="141.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Is it right, or</text><text x="297" y="159.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">only tidy?</text><rect x="217.0" y="186.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="211.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Is it what I</text><text x="297" y="229.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">asked for?</text><rect x="217.0" y="256.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="281.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What would</text><text x="297" y="299.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">break it?</text><rect x="200.0" y="432.0" width="190" height="108" rx="22" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="295" y="459.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Process</text><text x="295" y="480.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">discernment</text><text x="295" y="501.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">how AI arrived at</text><text x="295" y="522.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">its output</text><rect x="23.0" y="386.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="411.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Does each step</text><text x="103" y="429.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">follow?</text><rect x="23.0" y="456.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="481.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">What did it skip</text><text x="103" y="499.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">or assume?</text><rect x="23.0" y="526.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="551.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Would I reason</text><text x="103" y="569.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">that way?</text><rect x="10.0" y="702.0" width="190" height="108" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="105" y="729.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Performance</text><text x="105" y="750.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">discernment</text><text x="105" y="771.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">how AI behaves while</text><text x="105" y="792.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">you work together</text><rect x="217.0" y="656.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="681.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Is its style</text><text x="297" y="699.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">working for me?</text><rect x="217.0" y="726.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="751.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Did it ask, or</text><text x="297" y="769.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">guess?</text><rect x="217.0" y="796.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="821.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Is it only</text><text x="297" y="839.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">agreeing with me?</text><rect x="75.0" y="19.5" width="250" height="93" rx="22" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="50.3" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">Discernment</text><text x="200" y="72.3" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">judging what comes back,</text><text x="200" y="94.3" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">and how it got there</text><text x="200" y="918" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Based on the AI Fluency Framework © 2025 Rick</text><text x="200" y="936" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Dakan, Joseph Feller and Anthropic, CC</text><text x="200" y="954" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">BY-NC-SA 4.0. The questions are the author&#x27;s</text><text x="200" y="972" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">reading. Shared under the same license.</text></svg>
