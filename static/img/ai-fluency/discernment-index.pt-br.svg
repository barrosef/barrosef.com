<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" width="400" height="554" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Com que frequência as pessoas discernem</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="554" fill="#ffffff"/><text x="200" y="34" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Com que frequência as</text><text x="200" y="58" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">pessoas discernem</text><text x="200" y="80" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">parcela de 9.830 conversas no Claude.ai</text><text x="24" y="118" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Percebe contexto faltando</text><rect x="24" y="126" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="126" width="203.0" height="16" rx="8" fill="#1d4e89"/><text x="235.0" y="139" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">20,3%</text><text x="24" y="168" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Questiona raciocínio fraco</text><rect x="24" y="176" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="176" width="158.0" height="16" rx="8" fill="#1d4e89"/><text x="190.0" y="189" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">15,8%</text><text x="24" y="218" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Confere fatos que importam</text><rect x="24" y="226" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="226" width="87.0" height="16" rx="8" fill="#1d4e89"/><text x="119.0" y="239" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">8,7%</text><text x="200" y="286" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Com e sem idas e vindas</text><rect x="109.6" y="301" width="14" height="14" rx="4" fill="#b7791f"/><text x="129.60000000000002" y="313" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">refinou</text><rect x="192.8" y="301" width="14" height="14" rx="4" fill="#c9d0da"/><text x="212.8" y="313" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">não refinou</text><text x="24" y="342" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Percebe contexto faltando</text><rect x="24" y="350" width="228.0" height="14" rx="7" fill="#b7791f"/><text x="260.0" y="362" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">22,8%</text><rect x="24" y="370" width="57.0" height="14" rx="7" fill="#c9d0da"/><text x="89.0" y="382" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">5,7%</text><text x="24" y="408" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Questiona raciocínio fraco</text><rect x="24" y="416" width="179.0" height="14" rx="7" fill="#b7791f"/><text x="211.0" y="428" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">17,9%</text><rect x="24" y="436" width="32.0" height="14" rx="7" fill="#c9d0da"/><text x="64.0" y="448" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">3,2%</text><text x="200" y="478" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Fonte: The AI Fluency Index, Anthropic,</text><text x="200" y="496" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">fevereiro de 2026 (amostra de janeiro de 2026),</text><text x="200" y="514" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">que chama estes de os três comportamentos de</text><text x="200" y="532" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">discernimento. Rótulos encurtados pelo autor.</text></svg>
