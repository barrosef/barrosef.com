<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 966" width="400" height="966" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Descrição</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="966" fill="#ffffff"/><path d="M200,102 C152.5,102 152.5,162.0 105,162.0" fill="none" stroke="#1d4e89" stroke-width="6" stroke-linecap="round"/><path d="M200,216 C200,181.0 217,181.0 217,146" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C208.5,216 208.5,216 217,216" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M200,216 C200,251.0 217,251.0 217,286" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M105,270.0 C200.0,270.0 200.0,422.0 295,422.0" fill="none" stroke="#4f86cf" stroke-width="6" stroke-linecap="round"/><path d="M200,476 C200,441.0 183,441.0 183,406" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,476 C191.5,476 191.5,476 183,476" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M200,476 C200,511.0 183,511.0 183,546" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M295,530.0 C200.0,530.0 200.0,671.5 105,671.5" fill="none" stroke="#b7791f" stroke-width="6" stroke-linecap="round"/><path d="M200,736 C200,701.0 217,701.0 217,666" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,736 C208.5,736 208.5,736 217,736" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M200,736 C200,771.0 217,771.0 217,806" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><rect x="10.0" y="162.0" width="190" height="108" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="105" y="189.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Descrição do</text><text x="105" y="210.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">produto</text><text x="105" y="231.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">o resultado: formato,</text><text x="105" y="252.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">público e estilo</text><rect x="217.0" y="116.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="141.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">O que deve voltar, e</text><text x="297" y="159.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">em que forma?</text><rect x="217.0" y="186.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="211.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Quem vai ler ou</text><text x="297" y="229.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">rodar isso?</text><rect x="217.0" y="256.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="297" y="281.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Tenho um exemplo</text><text x="297" y="299.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">do que é bom?</text><rect x="200.0" y="422.0" width="190" height="108" rx="22" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="295" y="449.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Descrição do</text><text x="295" y="470.6" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">processo</text><text x="295" y="491.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">como a IA aborda o</text><text x="295" y="512.6" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">seu pedido</text><rect x="23.0" y="376.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="401.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Que passos, em</text><text x="103" y="419.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">que ordem?</text><rect x="23.0" y="446.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="471.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Que contexto e</text><text x="103" y="489.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">regras ela precisa?</text><rect x="23.0" y="516.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="103" y="541.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Pensar antes, ou</text><text x="103" y="559.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">responder direto?</text><rect x="10.0" y="671.5" width="190" height="129" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="105" y="699.1" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">Descrição do</text><text x="105" y="720.1" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">desempenho</text><text x="105" y="741.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">como a IA se</text><text x="105" y="762.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">comporta enquanto</text><text x="105" y="783.1" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">vocês trabalham</text><rect x="217.0" y="645.0" width="160" height="42" rx="21.0" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="670.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Curta ou detalhada?</text><rect x="217.0" y="706.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="731.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Me questionar, ou</text><text x="297" y="749.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">me apoiar?</text><rect x="217.0" y="776.0" width="160" height="60" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="297" y="801.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">Perguntar, ou</text><text x="297" y="819.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="500">supor?</text><rect x="80.0" y="19.5" width="240" height="93" rx="22" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="50.3" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">Descrição</text><text x="200" y="72.3" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">dizer o que você precisa, para</text><text x="200" y="94.3" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">a IA entregar</text><text x="200" y="888" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Baseado no AI Fluency Framework © 2025 Rick</text><text x="200" y="906" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Dakan, Joseph Feller e Anthropic, CC</text><text x="200" y="924" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">BY-NC-SA 4.0. As perguntas são leitura do</text><text x="200" y="942" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">autor. Compartilhado sob a mesma licença.</text></svg>
