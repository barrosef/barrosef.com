<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" width="400" height="530" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>How often people discern</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="530" fill="#ffffff"/><text x="200" y="34" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">How often people discern</text><text x="200" y="56" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">share of 9,830 conversations on Claude.ai</text><text x="24" y="94" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Spots missing context</text><rect x="24" y="102" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="102" width="203.0" height="16" rx="8" fill="#1d4e89"/><text x="235.0" y="115" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">20.3%</text><text x="24" y="144" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Questions weak reasoning</text><rect x="24" y="152" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="152" width="158.0" height="16" rx="8" fill="#1d4e89"/><text x="190.0" y="165" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">15.8%</text><text x="24" y="194" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Checks facts that matter</text><rect x="24" y="202" width="300" height="16" rx="8" fill="#eef2f7"/><rect x="24" y="202" width="87.0" height="16" rx="8" fill="#1d4e89"/><text x="119.0" y="215" font-size="15" fill="#1d4e89" text-anchor="start" font-weight="700">8.7%</text><text x="200" y="262" font-size="17" fill="#16233a" text-anchor="middle" font-weight="700">With and without iteration</text><rect x="121.0" y="277" width="14" height="14" rx="4" fill="#b7791f"/><text x="141.0" y="289" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">iterated</text><rect x="211.8" y="277" width="14" height="14" rx="4" fill="#c9d0da"/><text x="231.8" y="289" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">did not</text><text x="24" y="318" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Spots missing context</text><rect x="24" y="326" width="228.0" height="14" rx="7" fill="#b7791f"/><text x="260.0" y="338" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">22.8%</text><rect x="24" y="346" width="57.0" height="14" rx="7" fill="#c9d0da"/><text x="89.0" y="358" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">5.7%</text><text x="24" y="384" font-size="15" fill="#16233a" text-anchor="start" font-weight="500">Questions weak reasoning</text><rect x="24" y="392" width="179.0" height="14" rx="7" fill="#b7791f"/><text x="211.0" y="404" font-size="14" fill="#16233a" text-anchor="start" font-weight="700">17.9%</text><rect x="24" y="412" width="32.0" height="14" rx="7" fill="#c9d0da"/><text x="64.0" y="424" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="400">3.2%</text><text x="200" y="454" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">Source: The AI Fluency Index, Anthropic,</text><text x="200" y="472" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">February 2026 (January 2026 sample), which</text><text x="200" y="490" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">calls these the three discernment</text><text x="200" y="508" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">behaviours. Labels shortened by the author.</text></svg>
