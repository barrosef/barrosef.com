<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 821" width="400" height="821" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>After</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="821" fill="#ffffff"/><rect x="16" y="16" width="368" height="74" rx="14" fill="#f4f5f7" stroke="#c9d0da" stroke-width="1.5"/><text x="32" y="42" font-size="14" fill="#5d6b7d" text-anchor="start" font-weight="700">Before</text><text x="32" y="66" font-size="15" fill="#5d6b7d" text-anchor="start" font-weight="400" font-style="italic">“add the coupon rule to our checkout”</text><text x="16" y="116" font-size="14" fill="#1d4e89" text-anchor="start" font-weight="700">After</text><rect x="16" y="128" width="368" height="103" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="138" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="154" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Product</text><path d="M100.39999999999999,149 C230.2,149 230.2,149 360,149" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="180" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Add a Black Friday coupon to checkout.</text><text x="30" y="199" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Here are CouponService and the pricing</text><text x="30" y="218" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">code it touches.</text><rect x="16" y="241" width="368" height="84" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="251" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="267" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Product</text><path d="M100.39999999999999,262 C230.2,262 230.2,262 360,262" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="293" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">One use per customer. It never stacks</text><text x="30" y="312" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">with the upfront-payment discount.</text><rect x="16" y="335" width="368" height="84" rx="12" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.6"/><rect x="28" y="345" width="72.39999999999999" height="22" rx="11" fill="#1d4e89"/><text x="64.19999999999999" y="361" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Product</text><path d="M100.39999999999999,356 C230.2,356 230.2,356 360,356" fill="none" stroke="#1d4e89" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="387" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Follow the WELCOME10 coupon, which</text><text x="30" y="406" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">already uses our pattern.</text><rect x="16" y="429" width="368" height="103" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="439" width="72.39999999999999" height="22" rx="11" fill="#4f86cf"/><text x="64.19999999999999" y="455" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Process</text><path d="M100.39999999999999,450 C230.2,450 230.2,450 360,450" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="481" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">First list the edge cases and wait for</text><text x="30" y="500" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">my OK; then write the code and the</text><text x="30" y="519" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">tests.</text><rect x="16" y="542" width="368" height="84" rx="12" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.6"/><rect x="28" y="552" width="72.39999999999999" height="22" rx="11" fill="#4f86cf"/><text x="64.19999999999999" y="568" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Process</text><path d="M100.39999999999999,563 C230.2,563 230.2,563 360,563" fill="none" stroke="#4f86cf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="594" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Explain your reasoning before each</text><text x="30" y="613" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">change.</text><rect x="16" y="636" width="368" height="103" rx="12" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.6"/><rect x="28" y="646" width="105.19999999999999" height="22" rx="11" fill="#b7791f"/><text x="80.6" y="662" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Performance</text><path d="M133.2,657 C246.6,657 246.6,657 360,657" fill="none" stroke="#b7791f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/><text x="30" y="688" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">Be brief. If a rule is unclear, ask me</text><text x="30" y="707" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">instead of guessing, and tell me if my</text><text x="30" y="726" font-size="15" fill="#16233a" text-anchor="start" font-weight="400">plan has a hole.</text><text x="200" y="763" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">An example; the tags are the author&#x27;s</text><text x="200" y="781" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">reading of the three Description skills of</text><text x="200" y="799" font-size="13.5" fill="#5d6b7d" text-anchor="middle" font-weight="400">the AI Fluency Framework, CC BY-NC-SA 4.0.</text></svg>
