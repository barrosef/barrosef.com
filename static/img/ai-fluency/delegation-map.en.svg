<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Delegation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="1200" height="640" fill="#ffffff"/><rect x="480" y="28" width="240" height="60" rx="30.0" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.5"/><text x="600.0" y="66.05" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="700">Delegation</text><text x="600" y="118" font-size="17" fill="#1d4e89" text-anchor="middle" font-weight="500" font-style="italic">whether, when and how to bring AI in</text><path d="M600,132 L600,160 L210,160 L210,190" fill="none" stroke="#1d4e89" stroke-width="3"/><rect x="40" y="190" width="340" height="56" rx="10" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="210.0" y="225.0" font-size="20" fill="#16233a" text-anchor="middle" font-weight="700">Problem awareness</text><text x="210" y="278" font-size="15.5" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">your goal and the work, before AI</text><line x1="210" y1="290" x2="210" y2="310" stroke="#9fb4cf" stroke-width="2"/><rect x="30" y="310" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="210.0" y="339.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">What does finished look like?</text><line x1="210" y1="366" x2="210" y2="384" stroke="#9fb4cf" stroke-width="2"/><rect x="30" y="384" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="210.0" y="413.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">Who is it for, what is at stake?</text><line x1="210" y1="440" x2="210" y2="458" stroke="#9fb4cf" stroke-width="2"/><rect x="30" y="458" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="210.0" y="487.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">What do I know that AI can&#x27;t?</text><path d="M600,132 L600,160 L600,160 L600,190" fill="none" stroke="#1d4e89" stroke-width="3"/><rect x="430" y="190" width="340" height="56" rx="10" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="600.0" y="225.0" font-size="20" fill="#16233a" text-anchor="middle" font-weight="700">Platform awareness</text><text x="600" y="278" font-size="15.5" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">what this AI does well, and its limits</text><line x1="600" y1="290" x2="600" y2="310" stroke="#9fb4cf" stroke-width="2"/><rect x="420" y="310" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="600.0" y="339.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">What is this tool good at?</text><line x1="600" y1="366" x2="600" y2="384" stroke="#9fb4cf" stroke-width="2"/><rect x="420" y="384" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="600.0" y="413.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">What can&#x27;t it know or see?</text><line x1="600" y1="440" x2="600" y2="458" stroke="#9fb4cf" stroke-width="2"/><rect x="420" y="458" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="600.0" y="487.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">Where might it invent?</text><path d="M600,132 L600,160 L990,160 L990,190" fill="none" stroke="#1d4e89" stroke-width="3"/><rect x="820" y="190" width="340" height="56" rx="10" fill="#eef2f7" stroke="#1d4e89" stroke-width="1.5"/><text x="990.0" y="225.0" font-size="20" fill="#16233a" text-anchor="middle" font-weight="700">Task delegation</text><text x="990" y="278" font-size="15.5" fill="#5d6b7d" text-anchor="middle" font-weight="400" font-style="italic">split the work by strengths</text><line x1="990" y1="290" x2="990" y2="310" stroke="#9fb4cf" stroke-width="2"/><rect x="810" y="310" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="990.0" y="339.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">Which parts need my judgement?</text><line x1="990" y1="366" x2="990" y2="384" stroke="#9fb4cf" stroke-width="2"/><rect x="810" y="384" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="990.0" y="413.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">Which parts can AI do or draft?</text><line x1="990" y1="440" x2="990" y2="458" stroke="#9fb4cf" stroke-width="2"/><rect x="810" y="458" width="360" height="48" rx="24.0" fill="#ffffff" stroke="#9fb4cf" stroke-width="1.5"/><text x="990.0" y="487.425" font-size="15.5" fill="#16233a" text-anchor="middle" font-weight="500">Automation, augmentation or agency?</text><text x="600" y="590" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Based on the AI Fluency Framework © 2025 Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0. The questions are the author&#x27;s</text><text x="600" y="610" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">reading. Shared under the same license.</text></svg>
