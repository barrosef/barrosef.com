<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Delegation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="1200" height="770" fill="#ffffff"/><path d="M600,330 C485.0,330 485.0,200 370,200" fill="none" stroke="#1d4e89" stroke-width="7" stroke-linecap="round"/><path d="M370,200 C255.0,200 255.0,80 140,80" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M370,200 C245.0,200 245.0,205 120,205" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M370,200 C260.0,200 260.0,330 150,330" fill="none" stroke="#1d4e89" stroke-width="2.5" stroke-linecap="round"/><path d="M600,330 C715.0,330 715.0,200 830,200" fill="none" stroke="#4f86cf" stroke-width="7" stroke-linecap="round"/><path d="M830,200 C945.0,200 945.0,80 1060,80" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M830,200 C955.0,200 955.0,205 1080,205" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M830,200 C940.0,200 940.0,330 1050,330" fill="none" stroke="#4f86cf" stroke-width="2.5" stroke-linecap="round"/><path d="M600,330 C600,422.5 600,422.5 600,515" fill="none" stroke="#b7791f" stroke-width="7" stroke-linecap="round"/><path d="M600,515 C462.5,515 462.5,605 325,605" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M600,515 C600,595.0 600,595.0 600,675" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><path d="M600,515 C737.5,515 737.5,605 875,605" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-linecap="round"/><rect x="235.0" y="165.5" width="270" height="69" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="370" y="194.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Problem awareness</text><text x="370" y="216.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">your goal and the work, before AI</text><rect x="40.0" y="48.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="140" y="74.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">What does done</text><text x="140" y="94.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">look like?</text><rect x="20.0" y="173.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="120" y="199.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Who is it for, what</text><text x="120" y="219.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">is at stake?</text><rect x="50.0" y="298.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#1d4e89" stroke-width="1.8"/><text x="150" y="324.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">What do I know that</text><text x="150" y="344.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">AI doesn&#x27;t?</text><rect x="695.0" y="154.5" width="270" height="91" rx="22" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="830" y="183.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Platform awareness</text><text x="830" y="205.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">what this AI does</text><text x="830" y="227.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">well, and its limits</text><rect x="960.0" y="48.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1060" y="74.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">What is this</text><text x="1060" y="94.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">tool good at?</text><rect x="980.0" y="173.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1080" y="199.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">What can&#x27;t it</text><text x="1080" y="219.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">know or see?</text><rect x="950.0" y="298.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#4f86cf" stroke-width="1.8"/><text x="1050" y="324.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Where might it</text><text x="1050" y="344.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">make things up?</text><rect x="465.0" y="480.5" width="270" height="69" rx="22" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="600" y="509.7" font-size="19" fill="#16233a" text-anchor="middle" font-weight="700">Task delegation</text><text x="600" y="531.7" font-size="15" fill="#16233a" text-anchor="middle" font-weight="400" font-style="italic">split the work by strengths</text><rect x="225.0" y="573.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="325" y="599.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Which parts need</text><text x="325" y="619.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">my judgement?</text><rect x="500.0" y="643.5" width="200" height="63" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="600" y="669.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Which parts can AI</text><text x="600" y="689.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">do or draft?</text><rect x="775.0" y="563.5" width="200" height="83" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/><text x="875" y="589.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">Automation,</text><text x="875" y="609.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">augmentation or</text><text x="875" y="629.5" font-size="15" fill="#16233a" text-anchor="middle" font-weight="500">agency?</text><rect x="465.0" y="290.5" width="270" height="79" rx="22" fill="#1d4e89" stroke="#1d4e89" stroke-width="1.8"/><text x="600" y="324.5" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="700">Delegation</text><text x="600" y="350.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400" font-style="italic">whether, when and how to bring AI in</text><text x="600" y="738" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Based on the AI Fluency Framework © 2025 Rick Dakan, Joseph Feller and Anthropic, CC BY-NC-SA 4.0. The questions are the author&#x27;s reading.</text><text x="600" y="758" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Shared under the same license.</text></svg>
