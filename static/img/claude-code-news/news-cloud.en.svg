<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" width="400" height="490" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>1 · You start a task</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="490" fill="#ffffff"/><path d="M328,396.0 C392,396.0 392,66.0 332,66.0" fill="none" stroke="#b7791f" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M178,326 C178,338 178,344 178,354" fill="none" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><path d="M178,216 C178,228 178,234 178,244" fill="none" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><path d="M178,106 C178,118 178,124 178,134" fill="none" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(0,66.0)"><rect x="28.0" y="-38.0" width="300" height="76" rx="16" fill="#e9ecf1" stroke="#0b1622" stroke-width="1.8"/><text x="178" y="-14.799999999999999" font-size="15" fill="#0b1622" text-anchor="middle" font-weight="700">1 · You start a task</text><text x="178" y="4.200000000000001" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">from any device; it keeps</text><text x="178" y="23.200000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">going in the background</text></g><g transform="translate(0,176.0)"><rect x="28.0" y="-38.0" width="300" height="76" rx="16" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="178" y="-14.799999999999999" font-size="15" fill="#4f86cf" text-anchor="middle" font-weight="700">2 · Claude checks</text><text x="178" y="4.200000000000001" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">missing a dependency, network</text><text x="178" y="23.200000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">access or an API key?</text></g><g transform="translate(0,286.0)"><rect x="28.0" y="-38.0" width="300" height="76" rx="16" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="178" y="-14.799999999999999" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="700">3 · You approve</text><text x="178" y="4.200000000000001" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">the changes it shows; keys go in</text><text x="178" y="23.200000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">a form Claude never sees</text></g><g transform="translate(0,396.0)"><rect x="28.0" y="-38.0" width="300" height="76" rx="16" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="178" y="-14.799999999999999" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="700">4 · Setup saved</text><text x="178" y="4.200000000000001" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">the next session starts in</text><text x="178" y="23.200000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">the same environment</text></g><text x="352" y="231.0" font-size="14" fill="#b7791f" font-weight="700" text-anchor="middle" transform="rotate(-90 352 231.0)">next session</text><text x="178" y="474" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="600">Pro, Max and Ultra</text></svg>
