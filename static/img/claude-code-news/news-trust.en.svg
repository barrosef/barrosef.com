<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 425" width="400" height="425" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Trusted by default</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="425" fill="#ffffff"/><rect x="8" y="8" width="384" height="300" rx="30" fill="#f6f7f9" stroke="#5d6b7d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="200" y="40" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="600">Everything else: auto mode is blocked</text><rect x="30" y="62" width="340" height="224" rx="26" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="200" y="92" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="700">Added by /auto-mode-setup</text><text x="200" y="114" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">repos, domains and cloud</text><text x="200" y="133" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">storage you trust</text><text x="200" y="154" font-size="14" fill="#b7791f" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">saved in ~/.claude/settings.json</text><rect x="62" y="172" width="276" height="90" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="200" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="700">Trusted by default</text><text x="200" y="222" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">your working directory and</text><text x="200" y="241" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">this repo&#x27;s remotes</text><text x="200" y="344" font-size="14" fill="#0b1622" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">blockWritesOutsideWorkingDirectories</text><text x="200" y="368" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Write, Edit and NotebookEdit stay</text><text x="200" y="387" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">inside your working directories;</text><text x="200" y="406" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">shell, MCP and hooks are not limited</text></svg>
