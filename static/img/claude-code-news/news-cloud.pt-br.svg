<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 509" width="400" height="509" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>1 · Você começa a tarefa</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="509" fill="#ffffff"/><path d="M328,415.0 C392,415.0 392,66.0 332,66.0" fill="none" stroke="#b7791f" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M178,345 C178,357 178,363 178,373" fill="none" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><path d="M178,216 C178,228 178,234 178,244" fill="none" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><path d="M178,106 C178,118 178,124 178,134" fill="none" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(0,66.0)"><rect x="28.0" y="-38.0" width="300" height="76" rx="16" fill="#e9ecf1" stroke="#0b1622" stroke-width="1.8"/><text x="178" y="-14.799999999999999" font-size="15" fill="#0b1622" text-anchor="middle" font-weight="700">1 · Você começa a tarefa</text><text x="178" y="4.200000000000001" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">de qualquer aparelho; ela</text><text x="178" y="23.200000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">segue em segundo plano</text></g><g transform="translate(0,176.0)"><rect x="28.0" y="-38.0" width="300" height="76" rx="16" fill="#eaf2fc" stroke="#4f86cf" stroke-width="1.8"/><text x="178" y="-14.799999999999999" font-size="15" fill="#4f86cf" text-anchor="middle" font-weight="700">2 · O Claude verifica</text><text x="178" y="4.200000000000001" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">falta dependência, acesso à</text><text x="178" y="23.200000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">rede ou chave de API?</text></g><g transform="translate(0,295.5)"><rect x="28.0" y="-47.5" width="300" height="95" rx="16" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="178" y="-24.299999999999997" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="700">3 · Você aprova</text><text x="178" y="-5.299999999999997" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">as mudanças que ele mostra;</text><text x="178" y="13.700000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">a chave vai num formulário</text><text x="178" y="32.7" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">que o Claude não vê</text></g><g transform="translate(0,415.0)"><rect x="28.0" y="-38.0" width="300" height="76" rx="16" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="178" y="-14.799999999999999" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="700">4 · Ambiente salvo</text><text x="178" y="4.200000000000001" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">a próxima sessão começa</text><text x="178" y="23.200000000000003" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">no mesmo ambiente</text></g><text x="352" y="240.5" font-size="14" fill="#b7791f" font-weight="700" text-anchor="middle" transform="rotate(-90 352 240.5)">próxima sessão</text><text x="178" y="493" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="600">Pro, Max e Ultra</text></svg>
