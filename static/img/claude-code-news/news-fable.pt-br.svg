<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 666" width="400" height="666" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Por qual modelo começar</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="666" fill="#ffffff"/><text x="200" y="34" font-size="16" fill="#5d6b7d" text-anchor="middle" font-weight="600">Por qual modelo começar</text><path d="M200,89.5 C200,139.75 102,139.75 102,190.0" fill="none" stroke="#1d4e89" stroke-width="3" stroke-linecap="round"/><path d="M200,89.5 C249.0,89.5 249.0,180.5 298,180.5" fill="none" stroke="#b7791f" stroke-width="3" stroke-linecap="round"/><rect x="125.0" y="50.5" width="150" height="39" rx="16" fill="#0b1622" stroke="#0b1622" stroke-width="1.8"/><text x="200" y="74.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400">Sua tarefa</text><rect x="10.0" y="190.0" width="184" height="76" rx="16" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="102" y="213.2" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="700">Código do dia a dia</text><text x="102" y="232.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">comece pelo Opus 5.5,</text><text x="102" y="251.2" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">conselho do time</text><rect x="206.0" y="180.5" width="184" height="95" rx="16" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="298" y="203.7" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="700">Grande e aberta</text><text x="298" y="222.7" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">teste o Fable 5.2,</text><text x="298" y="241.7" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">até 30% mais rápido</text><text x="298" y="260.7" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">que o 5.1</text><text x="24" y="340" font-size="16" fill="#5d6b7d" text-anchor="start" font-weight="600">As datas do Fable</text><path d="M34,374 C30,440 38,456 34,510" fill="none" stroke="#b7791f" stroke-width="3" stroke-linecap="round"/><circle cx="34" cy="374" r="8" fill="#ffffff" stroke="#b7791f" stroke-width="3"/><text x="56" y="380" font-size="15" fill="#b7791f" text-anchor="start" font-weight="700">9/11, 10h (Pacífico)</text><text x="56" y="400" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">assinava antes disso?</text><text x="56" y="419" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">procure um reset do Fable</text><circle cx="34" cy="442" r="8" fill="#ffffff" stroke="#b7791f" stroke-width="3"/><text x="56" y="448" font-size="15" fill="#b7791f" text-anchor="start" font-weight="700">16/11</text><text x="56" y="468" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">Pro e Team Standard: acabam o teste (até</text><text x="56" y="487" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">50% do limite semanal) e o reset</text><circle cx="34" cy="510" r="8" fill="#ffffff" stroke="#b7791f" stroke-width="3"/><text x="56" y="516" font-size="15" fill="#b7791f" text-anchor="start" font-weight="700">8/3/2027</text><text x="56" y="536" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">prazo do reset no Max, no</text><text x="56" y="555" font-size="14" fill="#16233a" text-anchor="start" font-weight="400">Ultra e no Team Premium</text><rect x="40" y="588" width="320" height="58" rx="14" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="613" font-size="15" fill="#1d4e89" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">/model claude-fable-5-2</text><text x="200" y="633" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">pede a versão 2.1.321 ou mais nova</text></svg>
