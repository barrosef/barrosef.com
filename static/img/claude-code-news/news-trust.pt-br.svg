<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" width="400" height="444" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Confiável por padrão</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4e89"/></marker></defs><rect width="400" height="444" fill="#ffffff"/><rect x="8" y="8" width="384" height="319" rx="30" fill="#f6f7f9" stroke="#5d6b7d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="200" y="40" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="600">Todo o resto: o modo automático é barrado</text><rect x="30" y="62" width="340" height="243" rx="26" fill="#fbf3e6" stroke="#b7791f" stroke-width="1.8"/><text x="200" y="92" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="700">Somado pelo /auto-mode-setup</text><text x="200" y="114" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">repositórios, domínios e</text><text x="200" y="133" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">armazenamentos na nuvem em</text><text x="200" y="152" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">que você confia</text><text x="200" y="173" font-size="14" fill="#b7791f" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">salvo em ~/.claude/settings.json</text><rect x="62" y="191" width="276" height="90" rx="22" fill="#e6edf6" stroke="#1d4e89" stroke-width="1.8"/><text x="200" y="219" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="700">Confiável por padrão</text><text x="200" y="241" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">a sua pasta de trabalho e os</text><text x="200" y="260" font-size="14" fill="#16233a" text-anchor="middle" font-weight="400">remotes deste repositório</text><text x="200" y="363" font-size="14" fill="#0b1622" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">blockWritesOutsideWorkingDirectories</text><text x="200" y="387" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">Write, Edit e NotebookEdit ficam</text><text x="200" y="406" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">dentro das suas pastas de trabalho;</text><text x="200" y="425" font-size="14" fill="#5d6b7d" text-anchor="middle" font-weight="400">shell, MCP e hooks não são limitados</text></svg>
