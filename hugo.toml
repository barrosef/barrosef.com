baseURL = "https://barrosef.com/"
title = "Ed Barros"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[params]
  description = "Technology leadership — writing on engineering, systems and liberty."
  comments = true

  # The owner's professional facts live in data/career.yaml (one bilingual
  # source for the homepage, the about page and the footer).

  [params.analytics]
    ga4 = ""

  [params.newsletter]
    kitFormId = ""

  [params.giscus]
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/barrosef/"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/barrosef"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/barrosef2"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/barrosef/"
  [[params.socialIcons]]
    name = "tiktok"
    url = "https://www.tiktok.com/@barrosef"
  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/ed.barros.9231"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    contentDir = "content/en"
    weight = 1
    [[languages.en.menus.main]]
      name = "Writing"
      url = "/writing/"
      weight = 10
    [[languages.en.menus.main]]
      name = "About"
      url = "/about/"
      weight = 20
    [[languages.en.menus.main]]
      name = "Contact"
      url = "/contact/"
      weight = 30

  [languages.pt-br]
    languageName = "Português"
    languageCode = "pt-BR"
    contentDir = "content/pt-br"
    weight = 2
    [[languages.pt-br.menus.main]]
      name = "Artigos"
      url = "/pt-br/artigos/"
      weight = 10
    [[languages.pt-br.menus.main]]
      name = "Sobre"
      url = "/pt-br/sobre/"
      weight = 20
    [[languages.pt-br.menus.main]]
      name = "Contato"
      url = "/pt-br/contato/"
      weight = 30
