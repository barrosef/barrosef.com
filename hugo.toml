baseURL = "https://barrosef.com/"
title = "Ed Barros"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# dateModified came from the front matter's `date`, so every article claimed it
# had never been touched since publication. Git knows better, and the deploy
# workflow already checks out with fetch-depth: 0, which GitInfo needs.
enableGitInfo = true


[pagination]
  pagerSize = 20

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  # No feed for tag or category pages. The tag pages are noindex already, and 46
  # feeds were being generated and crawled for pages nobody subscribes to. The
  # feeds readers use — the home and each section — stay.
  term = ["HTML"]
  taxonomy = ["HTML"]

# Tag pages are thin while the archive is small: crawlable, but neither
# indexed nor listed in the sitemap. Categories stay in.
[[cascade]]
  [cascade.params]
    noindex = true
  [cascade.sitemap]
    disable = true
  [cascade._target]
    kind = "term"
    path = "/tags/**"
[[cascade]]
  [cascade.params]
    noindex = true
  [cascade.sitemap]
    disable = true
  [cascade._target]
    kind = "taxonomy"
    path = "/tags"

[params]
  description = "Software architecture, AI-assisted delivery and the decisions in between — by Ed Barros. Also jiu-jitsu, barbecue and liberty."
  comments = true

  # The owner's professional facts live in data/career.yaml (one bilingual
  # source for the homepage, the about page and the footer).

  # Google Analytics 4 measurement ID (G-XXXXXXXXXX). The tag loads only after
  # the visitor accepts the cookie banner; "Cookies" in the footer reopens it.
  [params.analytics]
    ga4 = "G-TED882VY3R"

  # Google Search Console: the content of the HTML-tag verification method.
  # (Verifying the domain by DNS TXT at the registrar needs nothing here.)
  [params.seo]
    googleSiteVerification = ""

  # The address on the Contact page. The footer and the about pages use
  # data/career.yaml's profile.email.
  [params.contact]
    email = "ed.barros@digitalbusinessone.com"

  [params.newsletter]
    kitFormId = ""

  [params.giscus]
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/barrosef/"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/barrosef"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/barrosef2"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/barrosef/"
  [[params.socialIcons]]
    name = "tiktok"
    url = "https://www.tiktok.com/@barrosef"
  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/ed.barros.9231"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    contentDir = "content/en"
    weight = 1
    [[languages.en.menus.main]]
      name = "Writing"
      url = "/writing/"
      weight = 10
    [[languages.en.menus.main]]
      name = "Series"
      url = "/series/"
      weight = 15
    [[languages.en.menus.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 20
    [[languages.en.menus.main]]
      name = "Contact"
      url = "/contact/"
      weight = 30

  [languages.pt-br]
    languageName = "Português"
    languageCode = "pt-BR"
    contentDir = "content/pt-br"
    weight = 2
    [languages.pt-br.params]
      description = "Arquitetura de software, entrega com IA e as decisões entre as duas — por Ed Barros. Também jiu-jitsu, churrasco e liberdade."
    [[languages.pt-br.menus.main]]
      name = "Artigos"
      url = "/pt-br/artigos/"
      weight = 10
    [[languages.pt-br.menus.main]]
      name = "Séries"
      url = "/pt-br/serie/"
      weight = 15
    [[languages.pt-br.menus.main]]
      identifier = "about"
      name = "Sobre"
      url = "/pt-br/sobre/"
      weight = 20
    [[languages.pt-br.menus.main]]
      name = "Contato"
      url = "/pt-br/contato/"
      weight = 30

# Lastmod from git rather than the front matter's `date`; see enableGitInfo.
[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime"]

# Related content, for the links at the foot of an article. Tags carry most of
# the weight because they are the finest signal the site has; the category is a
# coarse tiebreak and recency a finer one. `includeNewer` matters on a small
# archive: without it an early article can never point at a later one, which is
# exactly backwards for a site that keeps publishing.
[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 40
  [[related.indices]]
    name = "date"
    weight = 10
