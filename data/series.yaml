# Article series. What the site can render: names, episodes, and the links that
# live outside the site.
#
# Rule: never store the article's own URL here. Store its `key`, which is the
# article's translationKey, and let Hugo resolve the URL per language. A slug can
# change; the key does not, and a key that no longer resolves fails loudly at
# build time instead of quietly at read time.
#
# The working dossier for each series — what has been tested, what is queued,
# which numbers can be reused and where they came from — is not here. It lives in
# docs/series/<slug>.yaml in the workspace, because the site does not render it.

