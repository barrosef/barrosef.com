# The owner's career, as one source for the about page and the homepage.
#
# Every prose field is bilingual: { en: ..., pt-br: ... }. Templates read the
# current language with `index .field $.Site.Language.Lang`. The shape mirrors
# the career-source tool's data model (roles are not projects; a project
# carries problem / approach / outcome), so that tool can emit this file later.
#
# Deliberately absent: the phone number. It stays in the private CV.

profile:
  name: "Ed Fernando Barros"
  shortName: "Ed Barros"
  photo: "/img/profile.png"
  headline:
    en: "Software & Solutions Architect"
    pt-br: "Arquiteto de Software e Soluções"
  years: 23
  since: 2003
  # The homepage headline. His own closing line from the CV, not a slogan.
  hero:
    en: "Architecture a team can actually execute."
    pt-br: "Arquitetura que um time consegue de fato executar."
  positioning:
    en: "Twenty-three years building and running systems where failure is expensive — across stacks, teams and business domains that had little in common except the need to work."
    pt-br: "Vinte e três anos construindo e operando sistemas onde falhar custa caro — em stacks, times e domínios de negócio que tinham pouco em comum além da necessidade de funcionar."
  location:
    en: "Brasnorte, MT — Brazil"
    pt-br: "Brasnorte, MT — Brasil"
  email: "barrosef@gmail.com"
  linkedin: "https://www.linkedin.com/in/barrosef/"
  github: "https://github.com/barrosef"
  # The sectors delivered in, in the order the CV lists them. The visual proof
  # of range on the identity block.
  sectors:
    - { en: "Financial services", pt-br: "Serviços financeiros" }
    - { en: "Crypto-asset trading", pt-br: "Criptoativos" }
    - { en: "Sports", pt-br: "Esportes" }
    - { en: "Energy", pt-br: "Energia" }
    - { en: "Public security", pt-br: "Segurança pública" }
    - { en: "Tax & revenue", pt-br: "Tributação e receita" }
    - { en: "Justice", pt-br: "Justiça" }
  # Track-record band on the homepage.
  metrics:
    - value: "23"
      label: { en: "years building and running systems", pt-br: "anos construindo e operando sistemas" }
    - value: "7"
      label: { en: "business sectors delivered in", pt-br: "setores de negócio atendidos" }
    - value: "2"
      label: { en: "engineering teams built from hiring to handover", pt-br: "times de engenharia formados da contratação à transferência" }
  summary:
    - en: "Software architect and engineering lead with 23 years building and running systems where failure is expensive. I work across the full technical range — Java and Spring Boot, Angular and Node.js, microservices, cloud on AWS and GCP, identity and access management, event streaming, and the container and CI/CD tooling that keeps delivery predictable."
      pt-br: "Arquiteto de software e líder de engenharia com 23 anos construindo e operando sistemas onde falhar custa caro. Atuo em toda a faixa técnica — Java e Spring Boot, Angular e Node.js, microsserviços, nuvem em AWS e GCP, gestão de identidade e acesso, streaming de eventos, e o ferramental de contêineres e CI/CD que mantém a entrega previsível."
    - en: "I adapt quickly to new stacks, new teams and new business domains, and have delivered in financial services and crypto-asset trading, sports, energy, public security, tax and the justice sector. I have built development teams from hiring through to structured handover, and worked equally as hands-on engineer, architect and technical leader."
      pt-br: "Adapto-me rápido a novas stacks, novos times e novos domínios de negócio, e já entreguei em serviços financeiros e negociação de criptoativos, esportes, energia, segurança pública, tributação e no setor de justiça. Formei times de desenvolvimento da contratação até a transferência estruturada, e atuei igualmente como engenheiro hands-on, arquiteto e líder técnico."
    - en: "What carries across all of it is the same thing: turning business constraints into architecture a team can actually execute."
      pt-br: "O que atravessa tudo isso é a mesma coisa: transformar restrições de negócio em arquitetura que um time consegue de fato executar."

