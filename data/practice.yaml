# Homepage capability cards — the three consulting lines. Prose is
# { en, pt-br }, read with the current language code, like data/career.yaml.
items:
  - title: { en: "AI-assisted software development", pt-br: "Desenvolvimento de software com IA" }
    body:
      en: "Bringing AI into how a team builds software — agent-assisted engineering with the specifications, review gates and delivery cadence that make it dependable."
      pt-br: "Levar a IA para a forma como o time constrói software — engenharia assistida por agentes, com as especificações, os portões de revisão e a cadência de entrega que a tornam confiável."
  - title: { en: "Cloud infrastructure", pt-br: "Infraestrutura em nuvem" }
    body:
      en: "AWS and GCP environments designed for the load they will actually carry, automated end to end, with the trade-offs written down rather than assumed."
      pt-br: "Ambientes AWS e GCP projetados para a carga real, automatizados de ponta a ponta, com os trade-offs documentados em vez de presumidos."
  - title: { en: "IT product development", pt-br: "Desenvolvimento de produtos de TI" }
    body:
      en: "From the first specification to a shipped product: architecture, the team, and the operating cadence that makes delivery predictable instead of heroic."
      pt-br: "Da primeira especificação ao produto entregue: arquitetura, time e a cadência operacional que torna a entrega previsível em vez de heroica."
