# Homepage capability cards. Prose is { en, pt-br }, read with the current
# language code — the same shape as data/career.yaml.
items:
  - title: { en: "Engineering leadership", pt-br: "Liderança em engenharia" }
    body:
      en: "Hiring, structure, and the operating cadence that makes delivery predictable instead of heroic."
      pt-br: "Contratação, estrutura e a cadência operacional que torna a entrega previsível em vez de heroica."
  - title: { en: "Platform & architecture", pt-br: "Plataforma e arquitetura" }
    body:
      en: "Systems designed for the load they will actually carry, with the trade-offs written down rather than assumed."
      pt-br: "Sistemas projetados para a carga real, com os trade-offs documentados em vez de presumidos."
  - title: { en: "Technology strategy", pt-br: "Estratégia de tecnologia" }
    body:
      en: "Turning business constraints into direction a board can follow and a team can execute."
      pt-br: "Traduzir restrições de negócio em direção que o conselho acompanha e o time executa."
