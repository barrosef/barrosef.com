# Display names for tags. The slug cannot carry them: Hugo titleizes a term by
# capitalising each hyphenated word, which turns `spending-less-on-ai` into
# "Spending-Less-On-Ai" and `entrega-de-software` into "Entrega-De-Software" —
# and a slug has already lost the Portuguese accents that "Não agressão" needs.
#
# Only meta consumes these today (article:tag, JSON-LD keywords); categories are
# written capitalised in the front matter and render from there. A tag missing
# here falls back to the slug with hyphens turned into spaces, so adding a tag
# never breaks a build — it just reads plainer until it gets a line.

